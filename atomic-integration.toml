schema = 1
agent = "opencode"
version = "1.0.0"

[requires]
atomic = ">=0.11.0"

[skills-source]
package = "atomic-skills"

[[skill]]
src = "skills/atomic-vault/SKILL.md"
dst = "~/.config/opencode/skills/atomic-vault/SKILL.md"

[[skill]]
src = "skills/atomic-vcs/SKILL.md"
dst = "~/.config/opencode/skills/atomic-vcs/SKILL.md"

[[skill]]
src = "skills/code-intelligence/SKILL.md"
dst = "~/.config/opencode/skills/code-intelligence/SKILL.md"

[[skill]]
src = "skills/decision-record/SKILL.md"
dst = "~/.config/opencode/skills/decision-record/SKILL.md"

[[repo-file]]
src = "AGENTS.md"
dst = "AGENTS.md"

[agent-definition]
src = "agents/atomic.md.frontmatter"
body_from = "atomic-skills:AGENTS.md"
slot = "~/.config/opencode/agents/atomic.md"

[[file]]
src = "plugins/atomic-hooks.ts"
dst = "~/.config/opencode/plugins/atomic-hooks.ts"

[[file]]
src = "package.json"
dst = "~/.config/opencode/package.json"

# Registers the plugin (and default permissions) into the user's opencode.json
# via a deep merge — existing config is preserved, never clobbered.
[[settings]]
manifest = "hooks/opencode.atomic-hooks.json"
